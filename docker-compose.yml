# Infraestrutura da Equipe 02 - AED Aula 02
#
#   docker compose up -d      sobe Kafka (KRaft) + Postgres + Kafka UI
#   docker compose down -v    derruba tudo e apaga os volumes
#
# O "up -d" so devolve o prompt depois que o Kafka fica healthy, porque o
# kafka-ui declara depends_on com essa condicao.
#
# ATENCAO SE VOCE JA RODOU O DEMO DA AULA 01: as portas sao as mesmas
# (19092 / 15432 / 8081). Derrube o demo antes, com "docker compose down" na
# pasta dele. Os nomes de container aqui tem prefixo e02- justamente para o
# erro que voce recebe ser de porta ocupada, que e claro, e nao de nome
# duplicado, que confunde.
#
# POR QUE PORTAS ALTAS: 9092 e 5432 costumam ja estar ocupadas por instalacoes
# locais de Kafka e Postgres. Quando isso acontece o cliente conecta no servico
# errado e o erro que aparece e de autenticacao, nao de porta em uso.
services:

  kafka:
    image: apache/kafka:3.9.0
    container_name: e02-kafka
    ports:
      - "19092:9092"          # acesso a partir do host (aplicacoes e CLI)
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller

      # Tres listeners, tres papeis:
      #   PLAINTEXT   quem conecta de fora do Docker (servico-pix, servico-tarifacao)
      #   INTERNAL    quem conecta de dentro da rede do compose (kafka-ui, healthcheck)
      #   CONTROLLER  o quorum KRaft; precisa de endereco roteavel, nunca 0.0.0.0
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,INTERNAL://0.0.0.0:9094,CONTROLLER://localhost:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:19092,INTERNAL://kafka:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,INTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"

      # Rede de seguranca. Quem cria o topico com o numero certo de particoes e
      # o servico-pix, pelo bean NewTopic. Mas se o servico-tarifacao subir
      # primeiro, o topico nasce por auto-criacao — e o padrao do Kafka e UMA
      # particao, o que mataria o paralelismo sem ninguem perceber.
      KAFKA_NUM_PARTITIONS: 3
    healthcheck:
      # Sonda pelo listener INTERNAL de proposito. Apontando para localhost:9092
      # o broker responderia com o endereco ANUNCIADO (localhost:19092), a sonda
      # tentaria essa porta DENTRO do container, onde nada escuta, e o broker
      # ficaria eternamente "unhealthy" estando saudavel.
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9094 --list || exit 1"]
      interval: 5s
      timeout: 10s
      retries: 20

  postgres:
    image: postgres:16-alpine
    container_name: e02-postgres
    ports:
      - "15432:5432"
    environment:
      # Este banco pertence ao servico-tarifacao. Nele moram as tres tabelas do
      # consumidor: evento_processado (idempotencia), oferta (o plano do
      # cliente) e tarifa (o efeito de negocio).
      #
      # O servico-pix nao tem banco nesta etapa. Se vier a precisar, ganha o
      # PROPRIO servico aqui no compose — servico que compartilha tabela com
      # outro volta a ter o acoplamento que os eventos existem para desfazer.
      POSTGRES_DB: tarifacao
      POSTGRES_USER: tarifacao
      POSTGRES_PASSWORD: tarifacao
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tarifacao -d tarifacao"]
      interval: 3s
      timeout: 5s
      retries: 20

  # Interface web para inspecionar topicos, particoes e mensagens:
  # http://localhost:8081
  #
  # E por aqui que se confere o item 3 do checklist (os quatro cabecalhos ce_*
  # obrigatorios) e o item 4 (nenhuma data em epoch) — basta abrir a mensagem.
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: e02-kafka-ui
    ports:
      - "8081:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: equipe-02
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9094   # listener INTERNAL
      DYNAMIC_CONFIG_ENABLED: "true"
    depends_on:
      kafka:
        condition: service_healthy
